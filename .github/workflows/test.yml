name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get && mix format --check-formatted && mix test --warnings-as-errors
      - name: Check Elixir style with strict Credo
        run: mix credo
      - name: Scan Elixir code with Sobelow
        run: mix sobelow --no-router --compact --exit medium
      - name: Test Counters (Elixir)
        run: mix deps.get && mix test --warnings-as-errors
        working-directory: examples/basic
      - name: Test Frontier (Elixir)
        run: mix deps.get && mix test --warnings-as-errors
        working-directory: examples/frontier
      - run: npm ci --prefix test/browser
      - run: npx --prefix test/browser playwright install --with-deps chromium
      - run: bash test/browser/run.sh
        env:
          FOG_OF_WAR_BROWSER_CHANNEL: chromium
