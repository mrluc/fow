app = "fow-counters"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PHX_HOST = "fow-counters.fly.dev"
  PORT = "8080"
  PHX_SERVER = "true"
  ERL_FLAGS = "+S 2:2"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/"

    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
